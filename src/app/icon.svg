<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Triply">
  <!--
    Фавиконка: тот же знак, что и в `public/logo-mark.svg`, но плашкой и с
    заметно более толстыми линиями — на вкладке он рисуется в 16 пикселей, а
    фирменная тонкая обводка на таком размере просто исчезает.
  -->
  <rect width="64" height="64" rx="14" fill="#123c35"/>
  <g stroke="#f7f4ec" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="15" x2="13" y2="49.2"/>
    <line x1="32" y1="15" x2="51" y2="49.2"/>
    <line x1="13" y1="49.2" x2="51" y2="49.2"/>
  </g>
  <circle cx="32" cy="15" r="7" fill="#ff6b35"/>
  <circle cx="13" cy="49.2" r="7" fill="#a8c4b5"/>
  <circle cx="51" cy="49.2" r="7" fill="#a8c4b5"/>
</svg>
