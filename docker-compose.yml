services:
  db:
    image: postgres:17-alpine
    container_name: triply-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: triply
      POSTGRES_PASSWORD: triply
      POSTGRES_DB: triply
    # 5433 снаружи, чтобы не спорить с локально установленным Postgres на 5432
    ports:
      - "5433:5432"
    volumes:
      - triply-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triply -d triply"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Почтовый ящик для разработки: принимает письма приложения и показывает их
  # в браузере. Наружу ничего не уходит — ровно то, что нужно, чтобы пройти
  # восстановление пароля, не рискуя написать живому человеку.
  mail:
    image: axllent/mailpit:latest
    container_name: triply-mail
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP для приложения
      - "8025:8025"  # веб-ящик: http://localhost:8025

volumes:
  triply-db-data:
